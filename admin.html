<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seaside Apartments | Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="bg-slate-50 text-slate-800 font-sans">

  <div id="login-screen" class="min-h-screen flex items-center justify-center bg-slate-900">
    <div class="bg-white p-8 rounded-lg shadow-2xl w-96 text-center">
      <h1 class="text-2xl font-bold text-slate-800 mb-2">Yannis' Dashboard</h1>
      <p class="text-slate-500 mb-6 text-sm">Enter your password to access bookings.</p>

      <input type="password" id="admin-pass" placeholder="Password..."
        class="w-full px-4 py-3 rounded border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 mb-4">

      <button onclick="login()"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded transition">
        Login →
      </button>
      <p id="login-error" class="text-red-500 text-sm mt-3 hidden">Incorrect password.</p>
    </div>
  </div>

  <div id="dashboard" class="hidden min-h-screen flex flex-col">

    <header class="bg-slate-900 text-white p-4 flex justify-between items-center shadow-md">
      <h1 class="text-xl font-bold tracking-wide text-yellow-500">Seaside Admin</h1>
      <button onclick="logout()" class="text-sm bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded transition">Log
        Out</button>
    </header>

    <main class="flex-grow p-6 max-w-7xl mx-auto w-full">

      <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
        <div class="bg-white p-6 rounded-lg shadow border-l-4 border-blue-500">
          <h3 class="text-sm font-semibold text-slate-500 uppercase">Today's Check-ins</h3>
          <p class="text-3xl font-bold mt-2" id="stat-in">0</p>
        </div>
        <div class="bg-white p-6 rounded-lg shadow border-l-4 border-orange-500">
          <h3 class="text-sm font-semibold text-slate-500 uppercase">Today's Check-outs</h3>
          <p class="text-3xl font-bold mt-2" id="stat-out">0</p>
        </div>
        <div class="bg-white p-6 rounded-lg shadow border-l-4 border-yellow-500">
          <h3 class="text-sm font-semibold text-slate-500 uppercase">Pending Approvals</h3>
          <p class="text-3xl font-bold mt-2" id="stat-pending">0</p>
        </div>
        <div class="bg-white p-6 rounded-lg shadow border-l-4 border-green-500">
          <h3 class="text-sm font-semibold text-slate-500 uppercase">Monthly Revenue</h3>
          <p class="text-3xl font-bold mt-2 text-green-600" id="stat-revenue">€0</p>
        </div>
      </div>

      <div class="bg-white rounded-lg shadow overflow-hidden">
        <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
          <h2 class="text-lg font-bold">All Bookings</h2>
          <input type="text" id="search-bar" placeholder="Search guests..."
            class="px-3 py-2 border rounded text-sm w-64 focus:outline-none focus:ring-1 focus:ring-blue-500">
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="bg-slate-100 text-slate-600 text-sm uppercase">
                <th class="p-4 font-semibold">Guest</th>
                <th class="p-4 font-semibold">Dates</th>
                <th class="p-4 font-semibold">Room</th>
                <th class="p-4 font-semibold">Status</th>
                <th class="p-4 font-semibold text-right">Actions</th>
              </tr>
            </thead>
            <tbody id="bookings-tbody" class="divide-y divide-slate-200 text-sm">
              <tr>
                <td class="p-4 text-center text-slate-500" colspan="5">Loading bookings...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </main>
  </div>

  <script>
    // 1. SIMPLE LOGIN LOGIC
    // The password is hardcoded to Seaside2026! just like the old version
    function login() {
      const pass = document.getElementById('admin-pass').value;
      if (pass === 'Seaside2026!') {
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('dashboard').classList.remove('hidden');
        // Once logged in, we fetch the data!
        fetchBookings();
      } else {
        document.getElementById('login-error').classList.remove('hidden');
      }
    }

    // Hit "Enter" to login
    document.getElementById('admin-pass').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') login();
    });

    function logout() {
      document.getElementById('admin-pass').value = '';
      document.getElementById('dashboard').classList.add('hidden');
      document.getElementById('login-screen').classList.remove('hidden');
    }

    // 2. SUPABASE CONFIGURATION
    const SUPABASE_URL = 'https://ynqofinheztebouwfwrc.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_NS3bSZwK_djNqa944kliCw_lkOyVZDH';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let allBookings = [];

    async function fetchBookings() {
      const tbody = document.getElementById('bookings-tbody');
      tbody.innerHTML = '<tr><td class="p-4 text-center text-slate-500" colspan="5">Loading data...</td></tr>';

      try {
        const { data, error } = await sb.from('bookings').select('*').order('created_at', { ascending: false });
        if (error) throw error;
        allBookings = data || [];
        updateDashboard(allBookings);
        renderTable(allBookings);
      } catch (err) {
        tbody.innerHTML = '<tr><td class="p-4 text-center text-red-500" colspan="5">Failed to load bookings.</td></tr>';
        console.error(err);
      }
    }

    function updateDashboard(bookings) {
      const today = new Date().toISOString().split('T')[0];
      let tIn = 0, tOut = 0, tPending = 0, tRevenue = 0;

      bookings.forEach(b => {
        if (b.check_in === today) tIn++;
        if (b.check_out === today) tOut++;
        if (b.status && b.status.toLowerCase() === 'pending') tPending++;
        if (b.total_amount && (b.status && b.status.toLowerCase() !== 'cancelled' && b.status.toLowerCase() !== 'pending')) {
          tRevenue += parseFloat(b.total_amount);
        }
      });

      document.getElementById('stat-in').textContent = tIn;
      document.getElementById('stat-out').textContent = tOut;
      document.getElementById('stat-pending').textContent = tPending;
      document.getElementById('stat-revenue').textContent = '€' + tRevenue.toFixed(2);
    }

    function renderTable(bookings) {
      const tbody = document.getElementById('bookings-tbody');
      if (!bookings.length) {
        tbody.innerHTML = '<tr><td class="p-4 text-center text-slate-500" colspan="5">No bookings found.</td></tr>';
        return;
      }

      tbody.innerHTML = bookings.map(b => {
        let statusClass = 'bg-slate-100 text-slate-800';
        const st = (b.status || 'unknown').toLowerCase();
        if (st === 'paid') statusClass = 'bg-green-100 text-green-800';
        else if (st === 'pending') statusClass = 'bg-yellow-100 text-yellow-800';
        else if (st === 'cancelled') statusClass = 'bg-red-100 text-red-800';

        return `
        <tr class="hover:bg-slate-50 transition border-b border-slate-100 last:border-none">
          <td class="p-4">
            <p class="font-bold text-slate-800">${b.first_name || 'N/A'}</p>
            <p class="text-xs text-slate-500 mt-1">${b.email || ''} <br> ${b.phone || ''}</p>
          </td>
          <td class="p-4">
            <p class="text-sm"><span class="font-semibold text-green-600 w-8 inline-block">IN:</span> ${b.check_in || '-'}</p>
            <p class="text-sm mt-1"><span class="font-semibold text-red-600 w-8 inline-block">OUT:</span> ${b.check_out || '-'}</p>
          </td>
          <td class="p-4 font-semibold text-slate-700 text-sm">${b.room_type || '-'}</td>
          <td class="p-4">
            <span class="${statusClass} px-2 py-1 rounded text-xs font-bold uppercase tracking-wide">${b.status || 'NEW'}</span>
          </td>
          <td class="p-4 text-right">
             <a href="mailto:${b.email}" class="text-blue-500 hover:underline text-xs mr-3 font-semibold">Email</a>
             <button onclick="updateBookingStatus('${b.id}', 'cancelled')" class="text-red-500 hover:underline text-xs font-semibold">Cancel</button>
             <button onclick="updateBookingStatus('${b.id}', 'paid')" class="text-green-600 hover:underline text-xs font-semibold ml-3">Mark Paid</button>
          </td>
        </tr>
      `}).join('');
    }

    // Quick Search filter
    document.getElementById('search-bar').addEventListener('input', function (e) {
      const q = e.target.value.toLowerCase();
      const filtered = allBookings.filter(b => {
        return (b.first_name || '').toLowerCase().includes(q) ||
          (b.email || '').toLowerCase().includes(q) ||
          (b.phone || '').toLowerCase().includes(q);
      });
      renderTable(filtered);
    });

    async function updateBookingStatus(id, newStatus) {
      if (!confirm(`Are you sure you want to change the status to ${newStatus}?`)) return;
      try {
        const { error } = await sb.from('bookings').update({ status: newStatus }).eq('id', id);
        if (error) throw error;
        // Refresh purely to guarantee consistency
        fetchBookings();
      } catch (err) {
        alert('Could not update booking: ' + err.message);
      }
    }
  </script>
</body>

</html>
